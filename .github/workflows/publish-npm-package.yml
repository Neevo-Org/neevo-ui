name: Publish NPM Package

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish_npm:
    name: Publish To npm
    runs-on: ubuntu-latest
    environment:
      name: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify Release Tag Matches package.json
        if: github.event_name == 'release'
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          RELEASE_TAG="${{ github.event.release.tag_name }}"
          if [ "$RELEASE_TAG" != "v$PACKAGE_VERSION" ]; then
            echo "Release tag $RELEASE_TAG does not match package.json version v$PACKAGE_VERSION"
            exit 1
          fi

      - name: Show Toolchain
        run: |
          node --version
          npm --version

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build Package
        run: npm run build:lib

      - name: Inspect Publish Tarball
        run: npm pack --json > pack-summary.json

      - name: Generate SBOM
        run: npm sbom --omit=dev --sbom-format cyclonedx > sbom.cyclonedx.json

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: npm-release-artifacts
          path: |
            pack-summary.json
            sbom.cyclonedx.json

      - name: Publish Package
        run: npm publish
